# Diszort: main'e her push'ta Docker imajı derlenir, kur.sh ile uçtan uca denenir (sunucu
# denemeleri + jsdom arayüz denemesi + gerçek Chromium'la WebRTC/ses denemesi), ghcr.io'ya
# (v1, v2, ... ve latest) yüklenir ve kur.sh GitHub sürümü olarak yayınlanır.
#
# Sunucuda kurmak, başlatmak ve güncellemek (tek komut, son sürümü çeker):
#   curl -fsSL https://github.com/TahaGemici/diszort/releases/latest/download/kur.sh | sudo sh
name: docker

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: docker # sürümler sırayla çıksın
  cancel-in-progress: false

env:
  SURUM: v${{ github.run_number }}
  # Uçtan uca denemede beyaz liste ilk anahtarı (üretimde .env'de boş bırakılır).
  # Sunucu yalnızca 512 bit (128 hex) anahtar kabul eder; bu yüzden test anahtarı da 128 hex.
  ILK_ANAHTAR: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
  # Giriş freni: üretimde 10000 ms (10 saniyede 1). Denemeler çok sayıda giriş yaptığı için kısa.
  GIRIS_ARALIK_MS: '500'
  # Sesli kanal doluluk denemesi 10 kişi + 1 fazla ister; beyaz liste sınırı buna izin vermeli.
  MAX_KULLANICI: '15'
  # Kopan kişinin sesli kanal yerinin askıda kalma süresi: kısa ki dene.js süre dolumunu da denesin.
  SES_ASKI_MS: '3000'
  # Gerçek tarayıcı denemesi (test/tarayici.js) için.
  PLAYWRIGHT_SURUM: '1.63.0'
  JSDOM_SURUM: '30.1.3'

defaults:
  run:
    shell: bash # -e -o pipefail: borudaki bir komut hata verirse adım da başarısız olur

jobs:
  derle:
    name: Derle, dene, yayınla
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub sürümü
      packages: write # ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Sözdizimi
        run: |
          node --check sunucu/sunucu.js
          node --check sunucu/veritabani.js
          node --check web/ana.js
          node --check test/dene.js
          node --check test/arayuz.js
          node --check test/tarayici.js
          sh -n kurulum/kur.sh
          docker compose -f docker-compose.yml config --quiet

      - name: Deneme bağımlılıkları (ws, jsdom, Playwright + Chromium)
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "jsdom@$JSDOM_SURUM" "playwright@$PLAYWRIGHT_SURUM"
          npx playwright install --with-deps chromium

      - name: Arayüz (jsdom)
        run: node test/arayuz.js

      - name: İmajı derle
        # source etiketi: ghcr.io paketi bu depoya bağlansın (depo sayfasında görünsün).
        run: docker build --build-arg SURUM="$SURUM" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "diszort:$SURUM" .

      - name: kur.sh ile kur (yerel imaj)
        run: |
          # Chromium mikrofon izni varken 127.0.0.1'deki STUN/TURN'ü kullanmıyor: makinenin IP'si verilir.
          # Bu IP 10.x olduğu için coturn'ün iç ağ yasağından yalnızca o muaf tutulur (relay denemesi).
          IP=$(hostname -I | awk '{print $1}')
          echo "TURN adresi: $IP"
          sudo sh -c "IMAJ=diszort:$SURUM ILK_ANAHTAR=$ILK_ANAHTAR MAX_KULLANICI=$MAX_KULLANICI GIRIS_ARALIK_MS=$GIRIS_ARALIK_MS SES_ASKI_MS=$SES_ASKI_MS TURN_ADRESI=$IP TURN_IZINLI_IP=$IP sh kurulum/kur.sh" | tee kur.log
          grep -q 'Ayar dosyası oluşturuldu' kur.log
          grep -q 'Docker konteynerinde çalışıyor' kur.log

      - name: Web, signaling, STUN ve TURN
        run: |
          node test/dene.js http://127.0.0.1:8080
          sudo docker top diszort -o pid,uid,comm | tee ps.log
          # Kök olmayan kullanıcı (imaj: uid 1000) ile çalışmalı
          grep -Eq '^ *[0-9]+ +1000 +node$' ps.log
          grep -Eq '^ *[0-9]+ +1000 +turnserver$' ps.log

      - name: Gerçek tarayıcı (Chromium) ile sesli kanal
        env:
          # Sunucu yeniden başlarken herkesin kendiliğinden geri dönmesi de denenir.
          YENIDEN_BASLAT: sudo docker restart diszort
          # Yanıt vermeyen sunucu (telefonun uyanınca bulduğu ölü bağlantı): konteyner dondurulur.
          DONDUR: sudo docker pause diszort
          COZ: sudo docker unpause diszort
          TARAYICI_ZORUNLU: '1'
        run: node test/tarayici.js http://127.0.0.1:8080

      - name: Yazılı kanallar ve dosyalar yeniden başlatmada kalıyor
        run: |
          set -e
          ONCE=$(curl -fsS http://127.0.0.1:8080/saglik | sed -n 's/.*"mesaj":\([0-9]*\).*/\1/p')
          echo "yeniden başlatmadan önce mesaj: ${ONCE:-yok}"
          test "${ONCE:-0}" -gt 0
          sudo docker restart diszort
          YENI=
          for i in $(seq 30); do
            sleep 1
            YENI=$(curl -fsS http://127.0.0.1:8080/saglik | sed -n 's/.*"mesaj":\([0-9]*\).*/\1/p') || true
            [ -n "$YENI" ] && break
          done
          echo "yeniden başlatmadan sonra mesaj: ${YENI:-yok}"
          test "${YENI:-0}" -ge "$ONCE"
          # /var/lib/chat 0700 + sahibi 1000 (kur.sh); runner kullanıcısı içine bakamaz → sudo şart.
          sudo test -f /var/lib/chat/sohbet.db
          sudo test -d /var/lib/chat/yuklemeler
          # Dikkat: `docker logs | grep -q` pipefail altında 141 (SIGPIPE) verir — grep erken çıkınca
          # docker logs boruyu kırık bulur. Önce dosyaya yaz, sonra grep'le.
          sudo docker logs diszort > diszort.log 2>&1
          grep -q '\[veritabanı\]' diszort.log

      - name: Durdurunca düzgün kapanıyor mu
        run: |
          sudo docker stop diszort
          sudo docker logs diszort | tee gunluk.log
          grep -q 'Kapanıyor (SIGTERM)' gunluk.log
          KOD=$(sudo docker inspect -f '{{.State.ExitCode}}' diszort)
          if [ "$KOD" != 0 ]; then echo "düzgün kapanmadı (çıkış kodu $KOD)"; exit 1; fi

      - name: Yeniden kurulumda .env kalır
        run: |
          echo 'MAX_KISI=7' | sudo tee -a /var/lib/chat/.env
          sudo sh -c "IMAJ=diszort:$SURUM ILK_ANAHTAR=$ILK_ANAHTAR MAX_KULLANICI=$MAX_KULLANICI GIRIS_ARALIK_MS=$GIRIS_ARALIK_MS SES_ASKI_MS=$SES_ASKI_MS sh kurulum/kur.sh" | tee kur2.log
          if grep -q 'Ayar dosyası oluşturuldu' kur2.log; then echo ".env yeniden oluşturuldu"; exit 1; fi
          sudo grep -q '^MAX_KISI=7' /var/lib/chat/.env
          MAX_KISI=7 node test/dene.js http://127.0.0.1:8080

      - name: ghcr.io'ya yükle
        if: github.ref == 'refs/heads/main'
        run: |
          # İmaj adı depo adından bağımsız: ghcr.io/<sahip>/diszort (kur.sh de aynı adı kullanır).
          IMAJ=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/diszort
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "diszort:$SURUM" "$IMAJ:$SURUM"
          docker tag "diszort:$SURUM" "$IMAJ:latest"
          docker push "$IMAJ:$SURUM"
          docker push "$IMAJ:latest"

      - name: GitHub sürümü (kur.sh)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sed "s|^DEPO=.*|DEPO=$GITHUB_REPOSITORY|" kurulum/kur.sh > kur.sh
          sh -n kur.sh
          IMAJ=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/diszort
          NOTLAR=$(printf 'Kurmak ya da güncellemek için sunucuda:\n\n    curl -fsSL https://github.com/%s/releases/latest/download/kur.sh | sudo sh\n\nBu sürüme dönmek için sonuna `-s %s` ekle. İmaj: %s:%s' "$GITHUB_REPOSITORY" "$SURUM" "$IMAJ" "$SURUM")
          if gh release view "$SURUM" >/dev/null 2>&1; then # aynı çalıştırma yeniden denendiyse
            gh release upload "$SURUM" kur.sh --clobber
          else
            gh release create "$SURUM" kur.sh --target "$GITHUB_SHA" --title "Diszort $SURUM" --notes "$NOTLAR"
          fi
