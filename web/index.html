<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ses Kanalı</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="stylesheet" href="/stil.css">
<script src="/ana.js" defer></script>
</head>
<body>

<!-- Giriş: yalnızca ad. Hesap yok. -->
<div id="giris-ekrani" class="perde">
	<form id="giris" class="giris-kart">
		<h1>🔊 Ses Kanalı</h1>
		<label for="ad">Adın</label>
		<input id="ad" maxlength="32" autocomplete="nickname" required>
		<button id="gir" type="submit">Sunucuya gir</button>
		<button id="giris-iptal" class="ikincil" type="button" hidden>İsteği geri çek</button>
		<p id="giris-durum" class="durum" role="status" aria-live="polite"></p>
		<noscript><p>Bu sayfa JavaScript ister.</p></noscript>
	</form>
</div>

<!-- Sunucu: kanal listesi + sohbet + üyeler -->
<div id="uygulama" hidden>
	<aside id="kanal-panosu">
		<header class="sunucu-baslik">
			<b>Ses Kanalı</b>
			<span id="cevrimici-sayac" class="sayac" title="Çevrimiçi kişi">0</span>
			<button id="kenar-kapat" class="ikon-dugme mobil" type="button" aria-label="Kanalları kapat">✕</button>
		</header>
		<div class="kanal-kaydir">
			<div class="bolum-baslik">
				<span>Yazılı Kanallar</span>
				<button id="yazi-ekle" class="bolum-ekle" type="button" title="Yazılı kanal ekle" aria-label="Yazılı kanal ekle">＋</button>
			</div>
			<div id="yazi-kanallari" class="kanal-listesi"></div>
			<div class="bolum-baslik">
				<span>Sesli Kanallar</span>
				<button id="ses-ekle" class="bolum-ekle" type="button" title="Sesli kanal ekle" aria-label="Sesli kanal ekle">＋</button>
			</div>
			<div id="ses-kanallari" class="kanal-listesi"></div>
		</div>
		<div class="ben-kart">
			<span id="ben-avatar" class="avatar kucuk-avatar">?</span>
			<span class="ben-bilgi">
				<b id="ben-ad">—</b>
				<small id="ben-alt">bağlı</small>
			</span>
			<button id="ben-mikrofon" class="ikon-dugme" type="button" title="Mikrofonu kapat/aç" aria-label="Mikrofonu kapat veya aç" aria-pressed="false">🎤</button>
			<button id="ben-kapat" class="ikon-dugme tehlike" type="button" title="Sesli kanaldan ayrıl" aria-label="Sesli kanaldan ayrıl" hidden>📞</button>
		</div>
	</aside>

	<main id="ana">
		<header id="kanal-ust">
			<button id="menu" class="ikon-dugme mobil" type="button" aria-label="Kanalları göster">☰</button>
			<b id="kanal-ad">#genel</b>
			<span id="baglanti-durumu" class="etiket" hidden></span>
		</header>

		<div id="mesaj-alani">
			<button id="daha-eski" type="button" class="daha-eski" hidden>Daha eski mesajları yükle</button>
			<div id="mesajlar" aria-live="polite"></div>
		</div>

		<div id="ses-karti" hidden>
			<div class="bolum-baslik">Sesli: <b id="ses-kart-kanal"></b></div>
			<div id="ses-kisiler"><div id="ben-ses-satir" class="ses-kisi"></div></div>
		</div>

		<div id="yaziyor" class="yaziyor"></div>

		<form id="yazma">
			<button id="dosya-sec" class="ikon-dugme" type="button" title="Dosya ekle" aria-label="Dosya ekle">＋</button>
			<input id="dosya" type="file" hidden>
			<textarea id="metin" rows="1" maxlength="2000" placeholder="Mesaj yaz… (Enter gönderir, Shift+Enter alt satır)" aria-label="Mesaj"></textarea>
			<button id="gonder" type="submit" class="gonder" title="Gönder" aria-label="Gönder">➤</button>
		</form>
		<div id="yukleme" class="yukleme" hidden>
			<div class="yukleme-cubuk"><div id="yukleme-dolgu"></div></div>
			<span id="yukleme-yazi"></span>
		</div>
	</main>

	<aside id="uye-panosu">
		<div class="bolum-baslik">Çevrimiçi — <span id="uye-sayi">0</span></div>
		<div id="uye-listesi"></div>
		<div id="beyaz-liste" class="bolum-bilgi"></div>
	</aside>
</div>

<!-- İçeri girmek isteyenler: içeridekiler kabul eder ya da reddeder -->
<div id="istekler" class="istekler" aria-live="polite"></div>

<!-- Kanal ekleme / silme onayı için küçük pencere -->
<div id="pencere" class="pencere" hidden>
	<form id="pencere-form" class="pencere-kart" role="dialog" aria-modal="true" aria-labelledby="pencere-baslik">
		<h2 id="pencere-baslik">Kanal ekle</h2>
		<p id="pencere-metin" class="pencere-metin"></p>
		<input id="pencere-girdi" maxlength="24" autocomplete="off" aria-label="Kanal adı">
		<div class="pencere-dugmeler">
			<button id="pencere-iptal" class="ikincil" type="button">İptal</button>
			<button id="pencere-tamam" type="submit">Ekle</button>
		</div>
	</form>
</div>

<p id="durum" class="durum tost" role="status" aria-live="polite"></p>
</body>
</html>
