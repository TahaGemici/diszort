# Diszort: main'e her push'ta Docker imajı ve terminal istemcisi (CLI, Go) derlenir, uçtan uca denenir
# (sunucu denemeleri + jsdom arayüz denemesi + gerçek Chromium'la WebRTC/ses denemesi + CLI'ın
# Chromium'la aynı kanalda denemesi: ses, RED, yankı engelleme, ses ve ekran paylaşımı, dosya), imaj
# ghcr.io'ya yüklenir, kur.sh ve CLI GitHub sürümü olarak yayınlanır.
#
# Sürüm adı tarihtir (Türkiye saatiyle): vYY.AA.GG, ör. v26.11.15. Aynı gün birden çok koşu olursa o
# günün önceki sürümü silinir, yenisi aynı adla çıkar. İmajın kendi sürümü buna commit'i ekler
# (v26.11.15-abc1234): aynı gün iki güncelleme olsa da açık sayfalar sunucunun değiştiğini anlar.
#
# Sunucuda kurmak, başlatmak ve güncellemek (tek komut, son sürümü çeker):
#   curl -fsSL https://github.com/TahaGemici/diszort/releases/latest/download/kur.sh | sudo sh
# Terminal istemcisi (Linux x64; kurulum yok, ayarlar programın yanında):
#   curl -fsSLo diszort https://github.com/TahaGemici/diszort/releases/latest/download/diszort-linux-x64 && chmod +x diszort && ./diszort
name: docker

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: docker # sürümler sırayla çıksın
  cancel-in-progress: false

env:
  # Uçtan uca denemede beyaz liste ilk anahtarı (üretimde .env'de boş bırakılır).
  # Sunucu yalnızca 512 bit (128 hex) anahtar kabul eder; bu yüzden test anahtarı da 128 hex.
  ILK_ANAHTAR: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
  # Giriş freni: üretimde 10000 ms (10 saniyede 1). Denemeler çok sayıda giriş yaptığı için kısa.
  GIRIS_ARALIK_MS: '500'
  # Sesli kanal doluluk denemesi 10 kişi + 1 fazla ister; beyaz liste sınırı buna izin vermeli.
  MAX_KULLANICI: '15'
  # Kopan kişinin sesli kanal yerinin askıda kalma süresi: kısa ki dene.js süre dolumunu da denesin.
  SES_ASKI_MS: '3000'
  # Gerçek tarayıcı denemesi (test/tarayici.js) için.
  PLAYWRIGHT_SURUM: '1.63.0'
  JSDOM_SURUM: '30.1.3'

defaults:
  run:
    shell: bash # -e -o pipefail: borudaki bir komut hata verirse adım da başarısız olur

jobs:
  derle:
    name: Derle, dene, yayınla
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub sürümü
      packages: write # ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm adı (tarih, Türkiye saati) ve yapı kimliği
        run: |
          SURUM=$(TZ=Europe/Istanbul date +v%y.%m.%d)
          KISA=${GITHUB_SHA::7}
          echo "SURUM=$SURUM" >> "$GITHUB_ENV"
          echo "KISA=$KISA" >> "$GITHUB_ENV"
          echo "YAPI=$SURUM-$KISA" >> "$GITHUB_ENV"
          echo "Sürüm: $SURUM (yapı $SURUM-$KISA)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Terminal istemcisi (Go; sürümü cli/go.mod'dan).
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Sözdizimi
        run: |
          node --check sunucu/sunucu.js
          node --check sunucu/veritabani.js
          node --check web/ana.js
          node --check web/yanki.js
          node --check test/dene.js
          node --check test/yanki.js
          node --check test/kayip.js
          node --check test/arayuz.js
          node --check test/tarayici.js
          node --check test/cli.js
          sh -n kurulum/kur.sh
          sh -n cli/derle.sh
          sh -n cli/gurultu/uret.sh
          BICIMSIZ=$(gofmt -l cli)
          if [ -n "$BICIMSIZ" ]; then echo "gofmt gerekli: $BICIMSIZ"; exit 1; fi
          docker compose -f docker-compose.yml config --quiet

      - name: Deneme bağımlılıkları (ws, jsdom, Playwright + Chromium, PulseAudio, Xvfb; CLI'ın C kitaplıkları)
        run: |
          # apt her paket kurulumunda man sayfası dizinini baştan kurar (bu makinede dakikalar sürer): kapalı.
          sudo rm -f /var/lib/man-db/auto-update
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "jsdom@$JSDOM_SURUM" "playwright@$PLAYWRIGHT_SURUM"
          npx playwright install --with-deps chromium
          # CLI'a gömülen C kitaplıkları (Opus, VP8, libyuv, SpeexDSP), PipeWire başlıkları (Wayland ekranı,
          # çalışırken sistemdekini açar), wasm2c (web/rnnoise.wasm → C); denemede ses ve ekran.
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils xvfb x11-xserver-utils \
            libopus-dev libvpx-dev libyuv-dev libspeexdsp-dev libpipewire-0.3-dev wabt

      - name: CLI'ı derle (tek dosya, Linux x64) ve birim denemeleri
        run: |
          SURUM="$SURUM" COMMIT="$KISA" DEPO="$GITHUB_REPOSITORY" sh cli/derle.sh
          (cd cli && go vet ./... && go test ./...)
          ./cikti/diszort-linux-x64 --surum
          # Sistemden yalnızca libc istemeli (gerisi gömülü).
          ldd cikti/diszort-linux-x64
          if ldd cikti/diszort-linux-x64 | grep -Ev 'linux-vdso|libc\.so|libm\.so|ld-linux' | grep -q '=>'; then echo "beklenmeyen paylaşımlı kitaplık"; exit 1; fi

      - name: Arayüz (jsdom)
        run: node test/arayuz.js

      - name: Paylaşılan sesten kanaldakilerin sesini çıkarma (benzetim)
        run: node test/yanki.js

      - name: Paket kaybında yedekli ses (RED), gerçek Chromium
        env:
          TARAYICI_ZORUNLU: '1'
        run: node test/kayip.js

      - name: İmajı derle
        # source etiketi: ghcr.io paketi bu depoya bağlansın (depo sayfasında görünsün).
        run: docker build --build-arg SURUM="$YAPI" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "diszort:$SURUM" .

      - name: kur.sh ile kur (yerel imaj)
        run: |
          # Chromium mikrofon izni varken 127.0.0.1'deki STUN/TURN'ü kullanmıyor: makinenin IP'si verilir.
          # Bu IP 10.x olduğu için coturn'ün iç ağ yasağından yalnızca o muaf tutulur (relay denemesi).
          IP=$(hostname -I | awk '{print $1}')
          echo "TURN adresi: $IP"
          sudo sh -c "IMAJ=diszort:$SURUM ILK_ANAHTAR=$ILK_ANAHTAR MAX_KULLANICI=$MAX_KULLANICI GIRIS_ARALIK_MS=$GIRIS_ARALIK_MS SES_ASKI_MS=$SES_ASKI_MS TURN_ADRESI=$IP TURN_IZINLI_IP=$IP sh kurulum/kur.sh" | tee kur.log
          grep -q 'Ayar dosyası oluşturuldu' kur.log
          grep -q 'Docker konteynerinde çalışıyor' kur.log

      - name: Web, signaling, STUN ve TURN
        run: |
          node test/dene.js http://127.0.0.1:8080
          sudo docker top diszort -o pid,uid,comm | tee ps.log
          # Kök olmayan kullanıcı (imaj: uid 1000) ile çalışmalı
          grep -Eq '^ *[0-9]+ +1000 +node$' ps.log
          grep -Eq '^ *[0-9]+ +1000 +turnserver$' ps.log

      - name: Gerçek tarayıcı (Chromium) ile sesli kanal
        env:
          # Sunucu yeniden başlarken herkesin kendiliğinden geri dönmesi de denenir.
          YENIDEN_BASLAT: sudo docker restart diszort
          # Yanıt vermeyen sunucu (telefonun uyanınca bulduğu ölü bağlantı): konteyner dondurulur.
          DONDUR: sudo docker pause diszort
          COZ: sudo docker unpause diszort
          TARAYICI_ZORUNLU: '1'
        run: node test/tarayici.js http://127.0.0.1:8080

      - name: CLI, gerçek Chromium'la aynı kanalda (ses, RED, yankı, paylaşım, ekran, dosya)
        env:
          CLI_ZORUNLU: '1'
          CLI_IKILI: cikti/diszort-linux-x64
        run: node test/cli.js http://127.0.0.1:8080

      - name: Yazılı kanallar ve dosyalar yeniden başlatmada kalıyor
        run: |
          set -e
          ONCE=$(curl -fsS http://127.0.0.1:8080/saglik | sed -n 's/.*"mesaj":\([0-9]*\).*/\1/p')
          echo "yeniden başlatmadan önce mesaj: ${ONCE:-yok}"
          test "${ONCE:-0}" -gt 0
          sudo docker restart diszort
          YENI=
          for i in $(seq 30); do
            sleep 1
            YENI=$(curl -fsS http://127.0.0.1:8080/saglik | sed -n 's/.*"mesaj":\([0-9]*\).*/\1/p') || true
            [ -n "$YENI" ] && break
          done
          echo "yeniden başlatmadan sonra mesaj: ${YENI:-yok}"
          test "${YENI:-0}" -ge "$ONCE"
          # /var/lib/chat 0700 + sahibi 1000 (kur.sh); runner kullanıcısı içine bakamaz → sudo şart.
          sudo test -f /var/lib/chat/sohbet.db
          # Dikkat: `docker logs | grep -q` pipefail altında 141 (SIGPIPE) verir — grep erken çıkınca
          # docker logs boruyu kırık bulur. Önce dosyaya yaz, sonra grep'le.
          sudo docker logs diszort > diszort.log 2>&1
          grep -q '\[veritabanı\]' diszort.log

      - name: Durdurunca düzgün kapanıyor mu
        run: |
          sudo docker stop diszort
          sudo docker logs diszort | tee gunluk.log
          grep -q 'Kapanıyor (SIGTERM)' gunluk.log
          KOD=$(sudo docker inspect -f '{{.State.ExitCode}}' diszort)
          if [ "$KOD" != 0 ]; then echo "düzgün kapanmadı (çıkış kodu $KOD)"; exit 1; fi

      - name: Yeniden kurulumda .env kalır
        run: |
          echo 'MAX_KISI=7' | sudo tee -a /var/lib/chat/.env
          sudo sh -c "IMAJ=diszort:$SURUM ILK_ANAHTAR=$ILK_ANAHTAR MAX_KULLANICI=$MAX_KULLANICI GIRIS_ARALIK_MS=$GIRIS_ARALIK_MS SES_ASKI_MS=$SES_ASKI_MS sh kurulum/kur.sh" | tee kur2.log
          if grep -q 'Ayar dosyası oluşturuldu' kur2.log; then echo ".env yeniden oluşturuldu"; exit 1; fi
          sudo grep -q '^MAX_KISI=7' /var/lib/chat/.env
          MAX_KISI=7 node test/dene.js http://127.0.0.1:8080

      - name: Bu commit hâlâ main'in ucu mu
        id: uc
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Koşu sürerken main'e yeni commit itildiyse yayınlamayı o commit'in koşusu yapar (koşular
          # sırayla çalışır). Hem boşuna sürüm çıkmaz hem de GitHub, iş akışı dosyası main'dekinden farklı
          # bir commit'e GITHUB_TOKEN ile etiket açtırmaz (sürüm adımı "403 Resource not accessible" verir).
          UC=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$UC" = "$GITHUB_SHA" ]; then
            echo "yayinla=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main ilerledi (${UC:0:7}); yayınlamayı o commit'in koşusu yapacak."
          fi

      - name: ghcr.io'ya yükle
        if: steps.uc.outputs.yayinla == '1'
        run: |
          # İmaj adı depo adından bağımsız: ghcr.io/<sahip>/diszort (kur.sh de aynı adı kullanır).
          IMAJ=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/diszort
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "diszort:$SURUM" "$IMAJ:$SURUM"
          docker tag "diszort:$SURUM" "$IMAJ:latest"
          docker push "$IMAJ:$SURUM"
          docker push "$IMAJ:latest"

      - name: GitHub sürümü (kur.sh ve CLI)
        if: steps.uc.outputs.yayinla == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sed "s|^DEPO=.*|DEPO=$GITHUB_REPOSITORY|" kurulum/kur.sh > kur.sh
          sh -n kur.sh
          IMAJ=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')/diszort
          INDIR="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          NOTLAR=$(printf '%s\n' \
            "**Sunucu.** Kurmak ya da güncellemek için sunucuda:" "" \
            "    curl -fsSL $INDIR/kur.sh | sudo sh" "" \
            "Bu sürüme dönmek için sonuna \`-s $SURUM\` ekle. İmaj: $IMAJ:$SURUM (yapı $YAPI)." "" \
            "**Terminal istemcisi (CLI, Linux x64, ~15 MB).** Kurulum yok: indir, çalıştır. Ayarlar programın yanındaki diszort.json'da." "" \
            "    curl -fsSLo diszort $INDIR/diszort-linux-x64 && chmod +x diszort && ./diszort" "" \
            "Sohbet tam ekran açılır (yazdığın mesaj olarak gider); komutlar başka bir terminalde: \`./diszort komut\` (içeride \`yardım\`). tmux ile tek pencerede: \`./diszort --tmux\`." "" \
            "Program yeni sürümü kendisi haber verir: /güncelle (ya da ./diszort --guncelle).")
          # Eski düzendeki sürümler (v1, v2, …): etiketleriyle silinir (sürüm adı artık tarih).
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | { grep -E '^v[0-9]+$' || true; } | while read -r ETIKET; do
            echo "eski sürüm siliniyor: $ETIKET"
            gh release delete "$ETIKET" --yes --cleanup-tag
          done
          # Aynı gün önceki koşunun sürümü: silinir, yenisi aynı adla çıkar.
          if gh release view "$SURUM" >/dev/null 2>&1; then
            echo "bugünün önceki sürümü siliniyor: $SURUM"
            gh release delete "$SURUM" --yes --cleanup-tag
            for i in $(seq 20); do
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SURUM" >/dev/null 2>&1 || break
              sleep 1
            done
          fi
          gh release create "$SURUM" kur.sh cikti/diszort-linux-x64 cikti/surum.json --target "$GITHUB_SHA" --title "Diszort $SURUM" --notes "$NOTLAR" --latest
